[project]
name = "mpe"
version = "0.1.0"
description = "Multilingual Post-Training Safety Evaluation Framework"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
hf = [
    "transformers>=4.45",
    "torch>=2.3",
]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
