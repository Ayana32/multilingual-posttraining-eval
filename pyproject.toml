[project]
name = "mpe"
version = "0.1.0"
description = "Multilingual Post-Training Safety Evaluation Framework"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pandas>=2.2,<4",  # tested on 2.2.3 and 3.0.5; a jump to pandas 4 needs review before bumping
    "pyarrow>=15.0",
]

[project.optional-dependencies]
hf = [
    "transformers>=4.45",
    "torch>=2.3",
    "accelerate>=0.30",  # required by from_pretrained(..., device_map=...)
]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test requires network access to download the real PolyGuardPrompts dataset from Hugging Face (excluded in CI via `pytest -m \"not network\"`)",
]
