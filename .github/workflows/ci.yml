name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # transformers==5.22.2 is the training pin (phase4/train_config.yaml); it is
        # installed so test_phase4_trainingargs_build.py guards TrainingArguments
        # against the exact pinned version. accelerate is needed to build them.
        run: pip install -e ".[dev,phase3]" torch "transformers==5.22.2" accelerate

      - name: Run test suite (network-free)
        run: pytest -ra -m "not network"
