# Phase 2B: larger EN/KO evaluation, SFT checkpoint, KO.
# Uses the frozen 200-item parallel sample (configs/samples/
# phase2b_polyguard_en_ko_200.json) instead of limit_per_benchmark + seed --
# the manifest was generated by filtering out the 26 known unresolved-label
# ids from the English subset, THEN applying the existing
# deterministic_sample() over the remaining 1,699 eligible ids (seed=42),
# so the frozen set is null-free by construction. Natural harmful/unharmful
# distribution preserved (93 harmful / 107 unharmful), not forced to 50/50.
# EN and KO share an identical id set (verified directly against the cached
# parquet), so this same manifest is used unchanged for every Phase 2B
# EN/KO x SFT/DPO/RLVR config -- see the other five phase2b_*.yaml configs.
#
# Does NOT alter or reuse the completed 50-item pilot configs
# (pilot_*_polyguard.yaml) -- those remain untouched and unaffected;
# item_ids_manifest is a new, additive ExperimentConfig field that those
# configs never set.
#
# Like the Phase 2A SFT config, SFT has a real chat template -- expect
# generation_protocol="chat_template" for every record here.

name: phase2b_sft_ko_polyguard
lineage: instruct
stages: [sft]
languages: [ko]
benchmarks: [polyguard_prompts]
item_ids_manifest: configs/samples/phase2b_polyguard_en_ko_200.json
# Top-level `seed`/`limit_per_benchmark` intentionally omitted: they are
# ignored whenever item_ids_manifest is set (see PolyGuardPromptsLoader.
# load()'s item_ids path) -- the manifest's seed=42 (used to generate the
# frozen sample itself) is recorded in the manifest file, not here.

generation:
  temperature: 0.0
  max_new_tokens: 1024
  seed: 42
  # system_prompt_override intentionally omitted (defaults to None): same
  # policy as every Phase 2A config -- held constant across stages and
  # languages, not overridden (docs/phase2a-pilot.md section 0).
